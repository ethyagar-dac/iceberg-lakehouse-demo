# Trino catalog named "iceberg" (the file name becomes the catalog name).
# ${ENV:X} reads environment variable X, so no secrets are hard-coded here.

# Which connector this catalog uses.
connector.name=iceberg

# Where table metadata pointers live: the REST catalog service.
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://rest:8181

# How Trino reads and writes the actual files: its native S3 client, pointed at MinIO.
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=${ENV:AWS_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}

# Default file format for tables Trino creates.
iceberg.file-format=PARQUET
